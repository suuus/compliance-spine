[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-spine"
version = "0.1.0"
description = "ISEE-based compliance spine: GDPR + EU AI Act controls for agentic software delivery."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suzanne Daniels" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
# ZAVA can run on a native harness (no extra deps). DeepEval is the optional runner.
zava = ["deepeval>=1.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
compliance-spine = "compliance_spine.cli:main"
compliance-spine-mcp = "compliance_spine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The DeepEval tests must set env vars and importorskip before importing deepeval.
"zava/test_*.py" = ["E402"]
# Emitted pytest template strings carry docstrings that read best on one line.
"src/compliance_spine/agents/test_templates.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "zava"]
addopts = "-q"
