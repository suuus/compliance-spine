name: compliance-gate

# The compliance spine as a required PR check. Every step is fail-closed: if it cannot
# prove compliance, the job fails and the change does not merge.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly ZAVA + integrity regression (Mondays 06:00 UTC)

jobs:
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need the base branch to diff a PR

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install spine (with DeepEval runner)
        run: pip install -e ".[dev,zava]"

      - name: Confidentiality leak-guard
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          if [ -n "${LEAK_PATTERNS}" ]; then printf '%s\n' "${LEAK_PATTERNS}" > .leakpatterns; fi
          python ci/leak_scan.py .

      - name: Lint
        run: ruff check .

      - name: Intent <-> gate traceability
        run: compliance-spine doctor

      - name: Unit + integration tests
        run: pytest

      - name: ZAVA compliance evals
        run: compliance-spine eval

      - name: Evidence ledger integrity
        run: compliance-spine verify

      - name: Compliance review of the PR diff (code gates)
        if: github.event_name == 'pull_request'
        run: compliance-spine scan-diff --base "origin/${{ github.base_ref }}"
